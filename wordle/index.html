<!doctype html>
<html lang="en">
    <header>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="stylesheet" href="styles.css" />
        <title>Wordle</title>
    </header>
    <body>
        <h1 class="main-header"">Wordle</h1>
        <h2>Get 6 chances to guess a 5-letter word</h2>
        <div class="guesses">
            <div class="guess">
                <div class="guess-letter box_1-1"></div>
                <div class="guess-letter box_1-2"></div>
                <div class="guess-letter box_1-3"></div>
                <div class="guess-letter box_1-4"></div>
                <div class="guess-letter box_1-5"></div>
            </div>
            <div class="guess">
                <div class="guess-letter box_2-1"></div>
                <div class="guess-letter box_2-2"></div>
                <div class="guess-letter box_2-3"></div>
                <div class="guess-letter box_2-4"></div>
                <div class="guess-letter box_2-5"></div>
            </div>
            <div class="guess">
                <div class="guess-letter box_3-1"></div>
                <div class="guess-letter box_3-2"></div>
                <div class="guess-letter box_3-3"></div>
                <div class="guess-letter box_3-4"></div>
                <div class="guess-letter box_3-5"></div>
            </div>
            <div class="guess">
                <div class="guess-letter box_4-1"></div>
                <div class="guess-letter box_4-2"></div>
                <div class="guess-letter box_4-3"></div>
                <div class="guess-letter box_4-4"></div>
                <div class="guess-letter box_4-5"></div>
            </div>
            <div class="guess">
                <div class="guess-letter box_5-1"></div>
                <div class="guess-letter box_5-2"></div>
                <div class="guess-letter box_5-3"></div>
                <div class="guess-letter box_5-4"></div>
                <div class="guess-letter box_5-5"></div>
            </div>
            <div class="guess">
                <div class="guess-letter box_6-1"></div>
                <div class="guess-letter box_6-2"></div>
                <div class="guess-letter box_6-3"></div>
                <div class="guess-letter box_6-4"></div>
                <div class="guess-letter box_6-5"></div>
            </div>
        </div>
        <div class="keyboard">
            <div class="keyboard-row">
                <button type="button">Q</button>
                <button type="button">W</button>
                <button type="button">E</button>
                <button type="button">R</button>
                <button type="button">T</button>
                <button type="button">Y</button>
                <button type="button">U</button>
                <button type="button">I</button>
                <button type="button">O</button>
                <button type="button">P</button>
            </div>
            <div class="keyboard-row">
                <button type="button">A</button>
                <button type="button">S</button>
                <button type="button">D</button>
                <button type="button">F</button>
                <button type="button">G</button>
                <button type="button">H</button>
                <button type="button">J</button>
                <button type="button">K</button>
                <button type="button">L</button>
            </div>
            </div>
            <div class="keyboard-row">
                <button type="button" id="enter">Enter</button>
                <button type="button">Z</button>
                <button type="button">X</button>
                <button type="button">C</button>
                <button type="button">V</button>
                <button type="button">B</button>
                <button type="button">N</button>
                <button type="button">M</button>
                <button type="button" id="back">Back</button>
            </div>
        </div>
    </body>
    <script src="wordle.js"></script>
</html>
