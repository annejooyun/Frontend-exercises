<!doctype html>
<html lang="en">
    <header>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="stylesheet" href="styles.css" />
        <title>Wordle</title>
    </header>
    <body>
        <h1 class="main-header"">Wordle</h1>
        <h2>Get 6 chances to guess a 5-letter word.</h2>
        <div class="guess">
            <div class="letter box_1-1"></div>
            <div class="letter box_1-2"></div>
            <div class="letter box_1-3"></div>
            <div class="letter box_1-4"></div>
            <div class="letter box_1-5"></div>
        </div>
        <div class="guess">
            <div class="letter box_2-1"></div>
            <div class="letter box_2-2"></div>
            <div class="letter box_2-3"></div>
            <div class="letter box_2-4"></div>
            <div class="letter box_2-5"></div>
        </div>
        <div class="guess">
            <div class="letter box_3-1"></div>
            <div class="letter box_3-2"></div>
            <div class="letter box_3-3"></div>
            <div class="letter box_3-4"></div>
            <div class="letter box_3-5"></div>
        </div>
        <div class="guess">
            <div class="letter box_4-1"></div>
            <div class="letter box_4-2"></div>
            <div class="letter box_4-3"></div>
            <div class="letter box_4-4"></div>
            <div class="letter box_4-5"></div>
        </div>
        <div class="guess">
            <div class="letter box_5-1"></div>
            <div class="letter box_5-2"></div>
            <div class="letter box_5-3"></div>
            <div class="letter box_5-4"></div>
            <div class="letter box_5-5"></div>
        </div>
        <div class="guess">
            <div class="letter box_6-1"></div>
            <div class="letter box_6-2"></div>
            <div class="letter box_6-3"></div>
            <div class="letter box_6-4"></div>
            <div class="letter box_6-5"></div>
        </div>
    </body>
    <script src="wordle.js"></script>
</html>
