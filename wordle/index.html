<!doctype html>
<html lang="en">
    <header>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="stylesheet" href="styles.css" />
        <title>Wordle</title>
    </header>
    <body>
        <h1 class="main-header"">Wordle</h1>
        <h2>Get 6 chances to guess a 5-letter word</h2>
        <div class="guesses">
            <div class="guess">
                <div class="guess-letter box_1-1"></div>
                <div class="guess-letter box_1-2"></div>
                <div class="guess-letter box_1-3"></div>
                <div class="guess-letter box_1-4"></div>
                <div class="guess-letter box_1-5"></div>
            </div>
            <div class="guess">
                <div class="guess-letter box_2-1"></div>
                <div class="guess-letter box_2-2"></div>
                <div class="guess-letter box_2-3"></div>
                <div class="guess-letter box_2-4"></div>
                <div class="guess-letter box_2-5"></div>
            </div>
            <div class="guess">
                <div class="guess-letter box_3-1"></div>
                <div class="guess-letter box_3-2"></div>
                <div class="guess-letter box_3-3"></div>
                <div class="guess-letter box_3-4"></div>
                <div class="guess-letter box_3-5"></div>
            </div>
            <div class="guess">
                <div class="guess-letter box_4-1"></div>
                <div class="guess-letter box_4-2"></div>
                <div class="guess-letter box_4-3"></div>
                <div class="guess-letter box_4-4"></div>
                <div class="guess-letter box_4-5"></div>
            </div>
            <div class="guess">
                <div class="guess-letter box_5-1"></div>
                <div class="guess-letter box_5-2"></div>
                <div class="guess-letter box_5-3"></div>
                <div class="guess-letter box_5-4"></div>
                <div class="guess-letter box_5-5"></div>
            </div>
            <div class="guess">
                <div class="guess-letter box_6-1"></div>
                <div class="guess-letter box_6-2"></div>
                <div class="guess-letter box_6-3"></div>
                <div class="guess-letter box_6-4"></div>
                <div class="guess-letter box_6-5"></div>
            </div>
        </div>
        <div class="keyboard">
            <div class="keyboard-row">
                <div class="kb-letter q">Q</div>
                <div class="kb-letter w">W</div>
                <div class="kb-letter e">E</div>
                <div class="kb-letter r">R</div>
                <div class="kb-letter t">T</div>
                <div class="kb-letter y">Y</div>
                <div class="kb-letter u">U</div>
                <div class="kb-letter i">I</div>
                <div class="kb-letter o">O</div>
                <div class="kb-letter p">P</div>
            </div>
            <div class="keyboard-row">
                <div class="kb-letter a">A</div>
                <div class="kb-letter s">S</div>
                <div class="kb-letter d">D</div>
                <div class="kb-letter f">F</div>
                <div class="kb-letter g">G</div>
                <div class="kb-letter h">H</div>
                <div class="kb-letter j">J</div>
                <div class="kb-letter k">K</div>
                <div class="kb-letter l">L</div>
            </div>
            </div>
            <div class="keyboard-row">
                <div class="button enter">Enter</div>
                <div class="kb-letter z">Z</div>
                <div class="kb-letter x">X</div>
                <div class="kb-letter c">C</div>
                <div class="kb-letter v">V</div>
                <div class="kb-letter b">B</div>
                <div class="kb-letter n">N</div>
                <div class="kb-letter m">M</div>
                <div class="button back">Back</div>
            </div>
        </div>
    </body>
    <script src="wordle.js"></script>
</html>
