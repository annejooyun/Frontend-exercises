<!doctype html>
<html lang="en">
    <header>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="stylesheet" href="styles.css" />
        <title>Wordle</title>
    </header>
    <body>
        <h1 class="main-header"">Wordle</h1>
        <h2>Get 6 chances to guess a 5-letter word</h2>
        <div class="guesses">
            <div class="guess">
                <div class="letter box_1-1"></div>
                <div class="letter box_1-2"></div>
                <div class="letter box_1-3"></div>
                <div class="letter box_1-4"></div>
                <div class="letter box_1-5"></div>
            </div>
            <div class="guess">
                <div class="letter box_2-1"></div>
                <div class="letter box_2-2"></div>
                <div class="letter box_2-3"></div>
                <div class="letter box_2-4"></div>
                <div class="letter box_2-5"></div>
            </div>
            <div class="guess">
                <div class="letter box_3-1"></div>
                <div class="letter box_3-2"></div>
                <div class="letter box_3-3"></div>
                <div class="letter box_3-4"></div>
                <div class="letter box_3-5"></div>
            </div>
            <div class="guess">
                <div class="letter box_4-1"></div>
                <div class="letter box_4-2"></div>
                <div class="letter box_4-3"></div>
                <div class="letter box_4-4"></div>
                <div class="letter box_4-5"></div>
            </div>
            <div class="guess">
                <div class="letter box_5-1"></div>
                <div class="letter box_5-2"></div>
                <div class="letter box_5-3"></div>
                <div class="letter box_5-4"></div>
                <div class="letter box_5-5"></div>
            </div>
            <div class="guess">
                <div class="letter box_6-1"></div>
                <div class="letter box_6-2"></div>
                <div class="letter box_6-3"></div>
                <div class="letter box_6-4"></div>
                <div class="letter box_6-5"></div>
            </div>
        </div>
        <div class="keyboard">
            <div class="keyboard-row">
                <div class="letter q">Q</div>
                <div class="letter w">W</div>
                <div class="letter e">E</div>
                <div class="letter r">R</div>
                <div class="letter t">T</div>
                <div class="letter y">Y</div>
                <div class="letter u">U</div>
                <div class="letter i">I</div>
                <div class="letter o">O</div>
                <div class="letter p">P</div>
            </div>
            <div class="keyboard-row">
                <div class="letter a">A</div>
                <div class="letter s">S</div>
                <div class="letter d">D</div>
                <div class="letter f">F</div>
                <div class="letter g">G</div>
                <div class="letter h">H</div>
                <div class="letter j">J</div>
                <div class="letter k">K</div>
                <div class="letter l">L</div>
            </div>
            <div class="keyboard-row">
                <div class="button enter">Enter</div>
                <div class="letter z">Z</div>
                <div class="letter x">X</div>
                <div class="letter c">C</div>
                <div class="letter v">V</div>
                <div class="letter b">B</div>
                <div class="letter n">N</div>
                <div class="letter m">M</div>
                <div class="button back">Back</div>
            </div>
        </div>
    </body>
    <script src="wordle.js"></script>
</html>
